# Only for `make e2e-stack`: the tests log in more often than the production limit allows.
# The example add-on (frontend/e2e/fixtures/addons/hello) is mounted as a static add-on folder.
services:
  api:
    environment:
      LOGIN_RATE_LIMIT: 1000/minute
    volumes:
      - ../frontend/e2e/fixtures/addons:/addons:ro
  web:
    volumes:
      - ../frontend/e2e/fixtures/addons:/addons:ro
