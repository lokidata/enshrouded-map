[project]
name = "enshrouded-map-api"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.159.1",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "psycopg[binary]>=3.3.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501", "I001", "UP007", "UP035"]
"tests/*" = ["S101", "S105", "S106", "S603", "E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
