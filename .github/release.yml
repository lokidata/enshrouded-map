# Categories of the generated release notes (by pull request label).
changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot, "dependabot[bot]"]
  categories:
    - title: New
      labels: [enhancement]
    - title: Fixes
      labels: [bug, accessibility]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
