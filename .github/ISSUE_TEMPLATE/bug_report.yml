name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Image tag or commit
      description: For example `latest`, `1.2.3` or a commit sha
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, setup codes and invitation links first.
