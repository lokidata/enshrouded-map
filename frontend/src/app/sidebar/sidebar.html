<header>
  <div class="title-row">
    <h1>{{ 'title' | transloco }}</h1>
    <div class="lang" role="group" [attr.aria-label]="'language' | transloco">
      @for (code of languages; track code) {
        <button
          type="button"
          [class.active]="lang.lang() === code"
          [attr.aria-pressed]="lang.lang() === code"
          (click)="lang.set(code)"
        >
          {{ code.toUpperCase() }}
        </button>
      }
    </div>
  </div>
  <input
    type="search"
    class="search"
    [placeholder]="'search' | transloco"
    [attr.aria-label]="'search' | transloco"
    [value]="filters.query()"
    (input)="filters.query.set($any($event.target).value)"
  />
  <div class="toggles">
    <button type="button" (click)="filters.showAll()">{{ 'all' | transloco }}</button>
    <button type="button" (click)="filters.hideAll()">{{ 'none' | transloco }}</button>
  </div>
  <app-account-bar />
</header>
<div class="cats">
  @for (section of sections(); track section.label[0]) {
    <h2 class="section-title" [style.--c]="section.color">{{ section.label[lang.index()] }}</h2>
    <div class="cards">
      @for (cat of section.cats; track cat) {
        <app-category-card [cat]="cat" [color]="section.color" />
      }
    </div>
  }
</div>
